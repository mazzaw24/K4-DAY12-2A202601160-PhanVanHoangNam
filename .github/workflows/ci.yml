name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test checkpoints
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          API_TOKEN: ci-dummy
          REDIS_URL: "fake://"
        run: >-
          pytest tests
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build production image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag day12-chat:${{ github.sha }} .

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy
        run: >-
          railway up --detach --yes
          --project "${{ vars.RAILWAY_PROJECT_ID }}"
          --environment production
          --service chat

      - name: Smoke test
        run: |
          sleep 45
          curl --fail --show-error --silent "${{ vars.PUBLIC_URL }}/healthz"
